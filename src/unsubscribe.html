<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancelar Suscripción | Dr. Omar Valdez</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='68' font-family='Inter,Arial,sans-serif' font-size='48' font-weight='700' fill='white' text-anchor='middle'>OV</text></svg>" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #1e293b;
            padding: 1rem;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
        }
        .icon { font-size: 3rem; margin-bottom: 1rem; }
        h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; }
        .description { color: #64748b; font-size: 0.92rem; line-height: 1.6; margin-bottom: 1.5rem; }
        .status-box {
            padding: 1rem 1.25rem;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }
        .status-box.processing { background: #dbeafe; color: #1d4ed8; }
        .status-box.success { background: #d1fae5; color: #059669; }
        .status-box.error { background: #fee2e2; color: #dc2626; }
        .btn-home {
            display: inline-block;
            padding: 0.7rem 1.5rem;
            background: #2563eb;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.88rem;
            transition: background 0.2s;
        }
        .btn-home:hover { background: #1d4ed8; }
        .footer-text {
            margin-top: 1.5rem;
            font-size: 0.78rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fas fa-envelope"></i></div>
        <h1>Cancelar Suscripción</h1>
        <p class="description">Estamos procesando tu solicitud para dejar de recibir el newsletter del Dr. Omar Valdez Palazuelos.</p>
        <div class="status-box processing" id="statusBox"><i class="fas fa-spinner fa-spin"></i> Procesando tu solicitud...</div>
        <div id="actions" style="display:none;">
            <a href="/" class="btn-home">← Volver al sitio</a>
        </div>
        <p class="footer-text">Si cancelaste por error, puedes volver a suscribirte desde el sitio web.</p>
    </div>

    <script>
    const SUPABASE_URL = 'https://mogmgtnkyazpsgslucrx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vZ21ndG5reWF6cHNnc2x1Y3J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NDI0MTIsImV4cCI6MjA4NjQxODQxMn0.msfLGeM2tlAHlL101tA4tFiGqmoenHcgJWN_cUl3lKc';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    (async () => {
        const params = new URLSearchParams(window.location.search);
        const emailB64 = params.get('e');
        const statusBox = document.getElementById('statusBox');
        const actions = document.getElementById('actions');

        if (!emailB64) {
            statusBox.className = 'status-box error';
            statusBox.innerHTML = '<i class="fas fa-times-circle"></i> Enlace inválido. No se encontró información de suscripción.';
            actions.style.display = 'block';
            return;
        }

        try {
            // El enlace lleva el correo en base64 de sus bytes UTF-8; atob()
            // solo devuelve los bytes, y un correo con acento llegaría alterado.
            const bytes = Uint8Array.from(atob(emailB64), c => c.charCodeAt(0));
            const email = new TextDecoder().decode(bytes);
            // baja_suscriptor() es SECURITY DEFINER: un UPDATE directo de anon
            // no ve la fila (no hay política de SELECT) y no da de baja a nadie.
            const { error } = await db.rpc('baja_suscriptor', { correo: email });

            if (error) throw error;

            statusBox.className = 'status-box success';
            statusBox.innerHTML = '<i class="fas fa-check-circle"></i> Tu suscripción ha sido cancelada exitosamente.<br>Ya no recibirás más newsletters.';
        } catch (err) {
            statusBox.className = 'status-box error';
            statusBox.innerHTML = '<i class="fas fa-times-circle"></i> Hubo un error al procesar tu solicitud. Por favor intenta nuevamente o contacta a omar.valdez@uas.edu.mx';
        }

        actions.style.display = 'block';
    })();
    </script>
</body>
</html>
